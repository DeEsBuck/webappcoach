<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquiCoach – Profi-Modus</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/icons/appstore-images/ios/32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/icons/appstore-images/ios/180.png" />
  <meta name="theme-color" content="#0A1128" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Equicoach" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/coach.css" />
</head>
<body class="coach-app">

  <!-- Install Button -->
  <button id="install" class="app-button" hidden>APP installieren</button>

  <header>
    <h1>EquiCoach – Profi-Modus</h1>
  </header>

  <main class="container">
    <div id="chatOutput" class="chat-box" role="status" aria-live="polite">Willkommen im Profi-Modus. Stelle deine Frage zu Takt, Losgelassenheit oder Anlehnung.</div>

    <div class="input-area">
      <textarea id="userPrompt" aria-label="Deine Frage an den EquiCoach" placeholder="Beschreibe das Problem mit deinem Pferd..."></textarea>
      <button type="button" id="sendBtn" class="send-btn">Frage senden</button>
    </div>

    <section class="local-model-settings" aria-labelledby="modelSettingsTitle">
      <h2 id="modelSettingsTitle">KI-Dienst</h2>
      <label for="aiProvider">Dienst für den Profi-Modus</label>
      <select id="aiProvider">
        <option value="openrouter">OpenRouter Auto</option>
        <option value="ollama">Ollama auf diesem Gerät</option>
      </select>
      <p id="modelStatus" class="model-status" role="status" aria-live="polite">OpenRouter Auto ausgewählt.</p>
      <div id="localModelControls" hidden>
        <fieldset id="modelSettings" disabled>
          <label for="fastModel">Modell für kurze Fragen</label>
          <select id="fastModel"></select>
          <label for="advancedModel">Modell für komplexe Anfragen</label>
          <select id="advancedModel"></select>
        </fieldset>
        <button type="button" id="refreshModelsBtn" class="refresh-models-btn">Ollama-Modelle neu laden</button>
      </div>
      <small id="providerNote" class="ai-endpoint-note">OpenRouter wählt mit openrouter/auto ein passendes Modell aus. Fragen und Trainingsdaten werden an OpenRouter über den Server gesendet.</small>
    </section>
  </main>

  <script src="js/pwa.js"></script>
  <script src="js/modules/metadata.js"></script>
  <script src="js/modules/coach.js"></script>
</body>
</html>
